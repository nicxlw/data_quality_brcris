# Configuração do extrator BrCris.
# Caminhos relativos à raiz do projeto (a pasta onde está extract.py).
# Ajuste cada caminho `zip` para o nome real do ZIP em data/raw/.
# `fields` define o esquema-base; campos adicionais encontrados nos XMLs
# continuam a ser preservados pelo extrator.

person:
  zip: "data/raw/person.zip"
  source_prefix: "person"
  record_type: "Person"
  dataset: "person"
  fields:
    - "identifier.brcris"
    - "identifier.lattes"
    - "identifier.lattesShort"
    - "identifier.cpf"
    - "identifier.email"
    - "identifier.orcid"
    - "identifier.researcherID"
    - "identifier.scopusAuthorID"
    - "identifier.cienciaID"
    - "identifier.capes"
    - "identifier.openalex"
    - "identifier.dark"
    - "identifier.other"
    - "name"
    - "alternateName"
    - "citationName"
    - "gender"
    - "birthDate"
    - "birthCountry"
    - "birthState"
    - "birthCity"
    - "nationality"
    - "researchArea"
    - "fone"
    - "personalURL"
    - "miniBiography"

