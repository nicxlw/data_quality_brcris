# Use esta fonte SOMENTE se os vínculos de ResearchGroup estiverem em outro ZIP.
# Sem record_type/dataset, o extrator coleta as <relation> desse arquivo,
# sem criar linhas extras/sparse na tabela researchgroup.
# Ajuste o caminho abaixo para o ZIP verdadeiro das relações.
researchgroup_relations:
  zip: "data/raw/researchgroup_relations.zip"
  source_prefix: "researchgroup_relations"
